<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="100%" style="background:#0f172a; font-family:'Outfit',system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      .hdr-title { font-size: 20px; font-weight: 800; fill: #f8fafc; }
      .hdr-sub { font-size: 12px; fill: #94a3b8; }
      .core-hdr { font-size: 13px; font-weight: 800; fill: #c7d2fe; text-anchor: middle; }
      .core-status { font-size: 11px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .worker-hdr { font-size: 12px; font-weight: 800; }
      .task-title { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .task-sub { font-size: 9.5px; font-weight: 500; text-anchor: middle; }
      .note-lbl { font-size: 12.5px; font-weight: 800; fill: #34d399; }
      .note-txt { font-size: 11px; fill: #e2e8f0; }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .stream-line { stroke-dasharray: 6, 6; animation: streamFlow 1.2s linear infinite; }

      @keyframes workerPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.015); opacity: 1; }
      }
      .parallel-active { animation: workerPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="490" fill="#0f172a"/>

  <!-- Header -->
  <text x="30" y="38" class="hdr-title">Multi-Core Multi-Threading: True Hardware Parallelism</text>
  <text x="30" y="58" class="hdr-sub">Multiple physical silicon cores execute distinct threads simultaneously at the exact same clock cycle (Hardware Parallelism)</text>

  <!-- Core 0 (Coordinator / Master) -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="160" height="260" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="80" y="34" class="core-hdr">Core 0 (Master)</text>

    <rect x="15" y="55" width="130" height="180" rx="8" fill="#312e81"/>
    <text x="80" y="90" class="core-status" fill="#c7d2fe">Read tasks &amp;</text>
    <text x="80" y="110" class="core-status" fill="#c7d2fe">distribute</text>

    <circle cx="80" cy="150" r="18" fill="#4338ca"/>
    <polygon points="76,142 88,150 76,158" fill="#ffffff"/>

    <text x="80" y="195" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Concurrent</text>
    <text x="80" y="210" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Task Dispatcher</text>
  </g>

  <!-- Animated Stream Lines from Core 0 to Cores 1, 2, 3 -->
  <path d="M 190 145 L 245 145" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line"/>
  <path d="M 190 215 L 245 215" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line"/>
  <path d="M 190 285 L 245 285" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line"/>

  <!-- Three Worker Cores Operating Concurrently in Parallel -->
  <g transform="translate(250, 85)">
    <!-- Core 1 / Thread 1 (Sky Blue) -->
    <g transform="translate(0, 0)" class="parallel-active">
      <rect x="0" y="0" width="115" height="70" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="57" y="30" class="worker-hdr" fill="#ffffff" text-anchor="middle">Core 1</text>
      <text x="57" y="48" font-size="11" font-weight="700" fill="#e0f2fe" text-anchor="middle">Thread 1</text>

      <!-- Task 1 Steps inside Core 1 -->
      <g transform="translate(130, 10)">
        <rect x="0" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <text x="42" y="22" class="task-title" fill="#38bdf8">Task 1</text>
        <text x="42" y="38" class="task-sub" fill="#e2e8f0">Read</text>

        <line x1="85" y1="25" x2="98" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="100" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <text x="142" y="22" class="task-title" fill="#38bdf8">Task 1</text>
        <text x="142" y="38" class="task-sub" fill="#e2e8f0">Process</text>

        <line x1="185" y1="25" x2="198" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="200" y="0" width="95" height="50" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <text x="247" y="22" class="task-title" fill="#38bdf8">Task 1</text>
        <text x="247" y="38" class="task-sub" fill="#e2e8f0">Send output</text>
      </g>
    </g>

    <!-- Core 2 / Thread 2 (Emerald Green) -->
    <g transform="translate(0, 95)" class="parallel-active">
      <rect x="0" y="0" width="115" height="70" rx="8" fill="#047857" stroke="#34d399" stroke-width="1.8"/>
      <text x="57" y="30" class="worker-hdr" fill="#ffffff" text-anchor="middle">Core 2</text>
      <text x="57" y="48" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">Thread 2</text>

      <!-- Task 2 Steps inside Core 2 -->
      <g transform="translate(130, 10)">
        <rect x="0" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="42" y="22" class="task-title" fill="#34d399">Task 2</text>
        <text x="42" y="38" class="task-sub" fill="#e2e8f0">Read</text>

        <line x1="85" y1="25" x2="98" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="100" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="142" y="22" class="task-title" fill="#34d399">Task 2</text>
        <text x="142" y="38" class="task-sub" fill="#e2e8f0">Process</text>

        <line x1="185" y1="25" x2="198" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="200" y="0" width="95" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="247" y="22" class="task-title" fill="#34d399">Task 2</text>
        <text x="247" y="38" class="task-sub" fill="#e2e8f0">Send output</text>
      </g>
    </g>

    <!-- Core 3 / Thread 3 (Amber) -->
    <g transform="translate(0, 190)" class="parallel-active">
      <rect x="0" y="0" width="115" height="70" rx="8" fill="#b45309" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="57" y="30" class="worker-hdr" fill="#ffffff" text-anchor="middle">Core 3</text>
      <text x="57" y="48" font-size="11" font-weight="700" fill="#fef3c7" text-anchor="middle">Thread 3</text>

      <!-- Task 3 Steps inside Core 3 -->
      <g transform="translate(130, 10)">
        <rect x="0" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="42" y="22" class="task-title" fill="#fbbf24">Task 3</text>
        <text x="42" y="38" class="task-sub" fill="#e2e8f0">Read</text>

        <line x1="85" y1="25" x2="98" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="100" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="142" y="22" class="task-title" fill="#fbbf24">Task 3</text>
        <text x="142" y="38" class="task-sub" fill="#e2e8f0">Process</text>

        <line x1="185" y1="25" x2="198" y2="25" stroke="#64748b" stroke-width="1.5"/>

        <rect x="200" y="0" width="95" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="247" y="22" class="task-title" fill="#fbbf24">Task 3</text>
        <text x="247" y="38" class="task-sub" fill="#e2e8f0">Send output</text>
      </g>
    </g>
  </g>

  <!-- Convergence to Output Collector -->
  <path d="M 685 120 L 710 190" fill="none" stroke="#34d399" stroke-width="2" class="stream-line"/>
  <path d="M 685 215 L 710 215" fill="none" stroke="#34d399" stroke-width="2" class="stream-line"/>
  <path d="M 685 310 L 710 240" fill="none" stroke="#34d399" stroke-width="2" class="stream-line"/>

  <!-- Collect Outputs & Result Box -->
  <g transform="translate(710, 165)">
    <rect x="0" y="0" width="110" height="100" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="55" y="36" class="task-title" fill="#a7f3d0">Collect</text>
    <text x="55" y="52" class="task-title" fill="#a7f3d0">outputs</text>
    <rect x="18" y="64" width="74" height="24" rx="4" fill="#059669"/>
    <text x="55" y="80" class="task-title" fill="#ffffff">Output</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="790" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="20" y="26" class="note-lbl">MULTI-CORE HARDWARE PARALLELISM PRINCIPLES:</text>
    <text x="20" y="46" class="note-txt">• Clock Speed Limit: CPUs hit a thermal/power wall around 15 GHz due to extreme cooling difficulties.</text>
    <text x="20" y="62" class="note-txt">• Hardware Solution: Rather than speeding up 1 core, chip makers place 2, 4, 8, 16, or 50+ cores on a single CPU chip.</text>
    <text x="20" y="78" class="note-txt">• Software Solution: Java multithreading divides programs so threads run simultaneously on separate physical silicon cores!</text>
  </g>
</svg>

