<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#0f172a; font-family:'Outfit',system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      .hdr-title { font-size: 20px; font-weight: 800; fill: #f8fafc; }
      .hdr-sub { font-size: 12px; fill: #94a3b8; }
      .core-hdr { font-size: 13px; font-weight: 800; fill: #a5b4fc; letter-spacing: 0.5px; }
      .core-status { font-size: 11px; font-weight: 600; fill: #e2e8f0; }
      .t-name { font-size: 12px; font-weight: 800; }
      .t-state { font-size: 10.5px; font-weight: 600; }
      .time-lbl { font-size: 11px; font-weight: 700; fill: #cbd5e1; }
      .slot-t { font-size: 9.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .slot-sub { font-size: 9px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
      
      /* Pulse Animation for CPU Core */
      @keyframes cpuPulse {
        0%, 100% { stroke: #6366f1; stroke-width: 2; }
        50% { stroke: #38bdf8; stroke-width: 3.5; }
      }
      .cpu-border { animation: cpuPulse 2.5s infinite; }

      /* Timeline Pointer Animation across 9 slots (9 seconds total cycle) */
      @keyframes sweepPointer {
        0% { transform: translateX(0px); }
        11.1% { transform: translateX(80px); }
        22.2% { transform: translateX(160px); }
        33.3% { transform: translateX(240px); }
        44.4% { transform: translateX(320px); }
        55.5% { transform: translateX(400px); }
        66.6% { transform: translateX(480px); }
        77.7% { transform: translateX(560px); }
        88.8% { transform: translateX(640px); }
        100% { transform: translateX(0px); }
      }
      .timeline-cursor { animation: sweepPointer 9s infinite steps(1); }

      /* Dynamic Active States across 9 steps */
      @keyframes coreTextAnim {
        0%, 33.3%, 66.6% { fill: #38bdf8; }
        11.1%, 44.4%, 77.7% { fill: #34d399; }
        22.2%, 55.5%, 88.8% { fill: #fbbf24; }
      }
      .active-thread-text { animation: coreTextAnim 9s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" fill="#0f172a"/>

  <!-- Header -->
  <text x="30" y="38" class="hdr-title">Single-Core Multi-Threading: Time-Slicing Concurrency</text>
  <text x="30" y="58" class="hdr-sub">1 Physical CPU Core shares execution among threads via rapid context switches (Time-Slicing Concurrency)</text>

  <!-- CPU Box Left -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="#1e293b" class="cpu-border"/>
    <text x="100" y="28" class="core-hdr" text-anchor="middle">SINGLE CPU CORE</text>
    
    <rect x="15" y="42" width="170" height="92" rx="8" fill="#0f172a"/>
    <text x="100" y="66" class="core-status" text-anchor="middle">Scheduler Active</text>
    
    <!-- Animated Active Core Status -->
    <circle cx="45" cy="98" r="8" fill="#38bdf8">
      <animate attributeName="fill" values="#38bdf8;#34d399;#fbbf24;#38bdf8;#34d399;#fbbf24;#38bdf8;#34d399;#fbbf24;#38bdf8" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="102" class="t-name active-thread-text" font-size="14">
      <animate attributeName="textContent" values="Thread 1 RUNS;Thread 2 RUNS;Thread 3 RUNS;Thread 1 RUNS;Thread 2 RUNS;Thread 3 RUNS;Thread 1 RUNS;Thread 2 RUNS;Thread 3 RUNS;Thread 1 RUNS" dur="9s" repeatCount="indefinite"/>
      Active Thread
    </text>
    <text x="100" y="122" class="hdr-sub" text-anchor="middle" font-size="10">Rapid 10ms Time-Slices</text>
  </g>

  <!-- Thread Status Cards Right -->
  <g transform="translate(255, 80)">
    <!-- Thread 1 Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="560" height="42" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="18" y="26" class="t-name" fill="#38bdf8">Thread 1</text>
      
      <!-- Thread 1 dynamic status pill -->
      <rect x="90" y="9" width="455" height="24" rx="4" fill="#0c4a6e">
        <animate attributeName="fill" values="#0369a1;#1e293b;#1e293b;#0369a1;#1e293b;#1e293b;#0369a1;#1e293b;#1e293b;#0369a1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="25" class="t-state" fill="#bae6fd">
        <animate attributeName="textContent" values="🟢 RUNNING (Task 1: Read);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 1: Process);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 1: Output);✅ COMPLETED;✅ COMPLETED;🟢 RUNNING (Task 1: Read)" dur="9s" repeatCount="indefinite"/>
        Thread 1 State
      </text>
    </g>

    <!-- Thread 2 Card -->
    <g transform="translate(0, 54)">
      <rect x="0" y="0" width="560" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="18" y="26" class="t-name" fill="#34d399">Thread 2</text>
      
      <!-- Thread 2 dynamic status pill -->
      <rect x="90" y="9" width="455" height="24" rx="4" fill="#064e3b">
        <animate attributeName="fill" values="#1e293b;#047857;#1e293b;#1e293b;#047857;#1e293b;#1e293b;#047857;#1e293b;#1e293b" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="25" class="t-state" fill="#a7f3d0">
        <animate attributeName="textContent" values="💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 2: Read);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 2: Process);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 2: Output);✅ COMPLETED;💤 SLEEPING" dur="9s" repeatCount="indefinite"/>
        Thread 2 State
      </text>
    </g>

    <!-- Thread 3 Card -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="560" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="18" y="26" class="t-name" fill="#fbbf24">Thread 3</text>
      
      <!-- Thread 3 dynamic status pill -->
      <rect x="90" y="9" width="455" height="24" rx="4" fill="#78350f">
        <animate attributeName="fill" values="#1e293b;#1e293b;#b45309;#1e293b;#1e293b;#b45309;#1e293b;#1e293b;#b45309;#1e293b" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="25" class="t-state" fill="#fde68a">
        <animate attributeName="textContent" values="💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 3: Read);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 3: Process);💤 SLEEPING (Waiting / Relinquished CPU);💤 SLEEPING (Waiting / Relinquished CPU);🟢 RUNNING (Task 3: Output);💤 SLEEPING" dur="9s" repeatCount="indefinite"/>
        Thread 3 State
      </text>
    </g>
  </g>

  <!-- Timeline (Bottom Section) -->
  <g transform="translate(30, 255)">
    <text x="0" y="16" class="time-lbl">Processor Time-Sharing Sequence (Threads Take Turns on Single Core):</text>

    <!-- 9 Slots -->
    <g transform="translate(0, 30)">
      <!-- Slot 1: T1 Read -->
      <rect x="0" y="0" width="75" height="52" rx="6" fill="#0284c7"/>
      <text x="37" y="22" class="slot-t">Thread 1</text>
      <text x="37" y="38" class="slot-sub">Read</text>

      <!-- Slot 2: T2 Read -->
      <rect x="80" y="0" width="75" height="52" rx="6" fill="#10b981"/>
      <text x="117" y="22" class="slot-t">Thread 2</text>
      <text x="117" y="38" class="slot-sub">Read</text>

      <!-- Slot 3: T3 Read -->
      <rect x="160" y="0" width="75" height="52" rx="6" fill="#f59e0b"/>
      <text x="197" y="22" class="slot-t">Thread 3</text>
      <text x="197" y="38" class="slot-sub">Read</text>

      <!-- Slot 4: T1 Process -->
      <rect x="240" y="0" width="75" height="52" rx="6" fill="#0284c7"/>
      <text x="277" y="22" class="slot-t">Thread 1</text>
      <text x="277" y="38" class="slot-sub">Process</text>

      <!-- Slot 5: T2 Process -->
      <rect x="320" y="0" width="75" height="52" rx="6" fill="#10b981"/>
      <text x="357" y="22" class="slot-t">Thread 2</text>
      <text x="357" y="38" class="slot-sub">Process</text>

      <!-- Slot 6: T3 Process -->
      <rect x="400" y="0" width="75" height="52" rx="6" fill="#f59e0b"/>
      <text x="437" y="22" class="slot-t">Thread 3</text>
      <text x="437" y="38" class="slot-sub">Process</text>

      <!-- Slot 7: T1 Output -->
      <rect x="480" y="0" width="75" height="52" rx="6" fill="#0284c7"/>
      <text x="517" y="22" class="slot-t">Thread 1</text>
      <text x="517" y="38" class="slot-sub">Output</text>

      <!-- Slot 8: T2 Output -->
      <rect x="560" y="0" width="75" height="52" rx="6" fill="#10b981"/>
      <text x="597" y="22" class="slot-t">Thread 2</text>
      <text x="597" y="38" class="slot-sub">Output</text>

      <!-- Slot 9: T3 Output -->
      <rect x="640" y="0" width="75" height="52" rx="6" fill="#f59e0b"/>
      <text x="677" y="22" class="slot-t">Thread 3</text>
      <text x="677" y="38" class="slot-sub">Output</text>

      <!-- Animated Pointer / Highlight Box -->
      <g class="timeline-cursor">
        <rect x="0" y="0" width="75" height="52" rx="6" fill="none" stroke="#ffffff" stroke-width="3"/>
        <polygon points="37,-10 32,-3 42,-3" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="790" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="20" y="26" style="font-size: 12.5px; font-weight: 800; fill: #38bdf8;">CORE CONCURRENCY PRINCIPLES:</text>
    <text x="20" y="46" style="font-size: 11px; fill: #e2e8f0;">• Single-Core CPU CANNOT execute 2 instructions at the exact same nanosecond.</text>
    <text x="20" y="63" style="font-size: 11px; fill: #e2e8f0;">• Multi-threading on 1 core works via Concurrency (Time-Slicing): when Thread 1 sleeps/waits for I/O, Thread 2 takes the CPU.</text>
  </g>
</svg>

