<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 940" width="100%" height="100%" style="background:#ffffff; font-family:'Outfit',system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; font-weight: 500; }
      .section-heading { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .tag { font-size: 12px; font-weight: 700; fill: #4f46e5; }
      .box-label { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .box-sub { font-size: 10px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .note { font-size: 11.5px; font-weight: 500; fill: #64748b; font-style: italic; }
      .thread-title { font-size: 12px; font-weight: 700; text-anchor: middle; }
      .core-title { font-size: 13px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow-gray); }
      .arrow-purple { stroke: #8b5cf6; stroke-width: 2; fill: none; marker-end: url(#arrow-p); }
      .arrow-green { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrow-g); }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Card -->
  <rect x="15" y="15" width="1020" height="910" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="40" y="52" class="title">Execution Architectures: Single-Core vs. Multi-Core Multi-Threading</text>
  <text x="40" y="74" class="subtitle">Comprehensive comparison of Sequential, Time-Sliced Concurrency, and True Hardware Parallelism</text>

  <!-- ============================================================== -->
  <!-- A. SINGLE PROCESSOR - SINGLE SEQUENCE (DIAGRAM a)             -->
  <!-- ============================================================== -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="970" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="20" y="28" class="section-heading">A. Single Processor — Tasks Carried Out in Single Sequence (Pure Sequential)</text>
    <rect x="850" y="12" width="100" height="24" rx="12" fill="#eff6ff"/>
    <text x="900" y="28" class="tag" text-anchor="middle">Diagram (a)</text>

    <!-- 9 Sequential Boxes -->
    <!-- Task 1 (Sky Blue) -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="90" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="45" y="18" class="box-label" fill="#0284c7">Task 1</text>
      <text x="45" y="32" class="box-sub">Read</text>

      <line x1="90" y1="21" x2="104" y2="21" class="arrow"/>

      <rect x="106" y="0" width="90" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="151" y="18" class="box-label" fill="#0284c7">Task 1</text>
      <text x="151" y="32" class="box-sub">Process</text>

      <line x1="196" y1="21" x2="210" y2="21" class="arrow"/>

      <rect x="212" y="0" width="90" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="257" y="18" class="box-label" fill="#0284c7">Task 1</text>
      <text x="257" y="32" class="box-sub">Output</text>

      <line x1="302" y1="21" x2="316" y2="21" class="arrow"/>

      <!-- Task 2 (Emerald Green) -->
      <rect x="318" y="0" width="90" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <text x="363" y="18" class="box-label" fill="#059669">Task 2</text>
      <text x="363" y="32" class="box-sub">Read</text>

      <line x1="408" y1="21" x2="422" y2="21" class="arrow"/>

      <rect x="424" y="0" width="90" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <text x="469" y="18" class="box-label" fill="#059669">Task 2</text>
      <text x="469" y="32" class="box-sub">Process</text>

      <line x1="514" y1="21" x2="528" y2="21" class="arrow"/>

      <rect x="530" y="0" width="90" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <text x="575" y="18" class="box-label" fill="#059669">Task 2</text>
      <text x="575" y="32" class="box-sub">Output</text>

      <line x1="620" y1="21" x2="634" y2="21" class="arrow"/>

      <!-- Task 3 (Amber) -->
      <rect x="636" y="0" width="90" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="681" y="18" class="box-label" fill="#d97706">Task 3</text>
      <text x="681" y="32" class="box-sub">Read</text>

      <line x1="726" y1="21" x2="740" y2="21" class="arrow"/>

      <rect x="742" y="0" width="90" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="787" y="18" class="box-label" fill="#d97706">Task 3</text>
      <text x="787" y="32" class="box-sub">Process</text>

      <line x1="832" y1="21" x2="846" y2="21" class="arrow"/>

      <rect x="848" y="0" width="82" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="889" y="18" class="box-label" fill="#d97706">Task 3</text>
      <text x="889" y="32" class="box-sub">Output</text>
    </g>

    <text x="20" y="112" class="note">Total Execution Time = T1 (Read + Process + Output) + T2 (Read + Process + Output) + T3 (Read + Process + Output). No overlapping; CPU stalls if any task waits on I/O.</text>
  </g>

  <!-- ============================================================== -->
  <!-- B. SINGLE PROCESSOR - THREADS SHARE TIME (DIAGRAM b)           -->
  <!-- ============================================================== -->
  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="970" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="20" y="28" class="section-heading">B. Single Processor — Threads Share the Time of Processor (Time-Slicing Concurrency)</text>
    <rect x="850" y="12" width="100" height="24" rx="12" fill="#e0e7ff"/>
    <text x="900" y="28" class="tag" text-anchor="middle">Diagram (b)</text>

    <!-- Thread Labels on Left -->
    <g transform="translate(20, 50)">
      <!-- Thread 1 -->
      <rect x="0" y="0" width="105" height="46" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
      <text x="52" y="28" class="thread-title" fill="#0284c7">Thread 1</text>

      <!-- Thread 2 -->
      <rect x="0" y="58" width="105" height="46" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6"/>
      <text x="52" y="86" class="thread-title" fill="#059669">Thread 2</text>

      <!-- Thread 3 -->
      <rect x="0" y="116" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
      <text x="52" y="144" class="thread-title" fill="#d97706">Thread 3</text>
    </g>

    <!-- Time Slices Timeline -->
    <g transform="translate(140, 50)">
      <!-- Column 1: Thread 1 runs Read Task 1 -->
      <rect x="0" y="0" width="85" height="46" rx="6" fill="#0284c7"/>
      <text x="42" y="20" class="box-label" fill="#ffffff">Thread 1 runs</text>
      <text x="42" y="34" class="box-sub" fill="#e0f2fe">Read Task 1</text>

      <line x1="85" y1="23" x2="98" y2="23" class="arrow"/>

      <!-- Thread 1 sleeps -->
      <rect x="100" y="0" width="85" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <text x="142" y="28" class="box-sub" fill="#94a3b8">Thread 1 sleeps</text>

      <!-- Downward switch arrow to Thread 2 -->
      <path d="M 142 46 L 142 56 L 195 56 L 195 72" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-p)"/>

      <!-- Column 2: Thread 2 runs Read Task 2 -->
      <rect x="200" y="58" width="85" height="46" rx="6" fill="#10b981"/>
      <text x="242" y="78" class="box-label" fill="#ffffff">Thread 2 runs</text>
      <text x="242" y="92" class="box-sub" fill="#ecfdf5">Read Task 2</text>

      <line x1="285" y1="81" x2="298" y2="81" class="arrow"/>

      <!-- Thread 2 sleeps -->
      <rect x="300" y="58" width="85" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <text x="342" y="86" class="box-sub" fill="#94a3b8">Thread 2 sleeps</text>

      <!-- Downward switch arrow to Thread 3 -->
      <path d="M 342 104 L 342 114 L 395 114 L 395 130" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-p)"/>

      <!-- Column 3: Thread 3 runs Read Task 3 -->
      <rect x="400" y="116" width="85" height="46" rx="6" fill="#f59e0b"/>
      <text x="442" y="136" class="box-label" fill="#ffffff">Thread 3 runs</text>
      <text x="442" y="150" class="box-sub" fill="#fef3c7">Read Task 3</text>

      <line x1="485" y1="139" x2="498" y2="139" class="arrow"/>

      <!-- Thread 3 sleeps -->
      <rect x="500" y="116" width="85" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <text x="542" y="144" class="box-sub" fill="#94a3b8">Thread 3 sleeps</text>

      <!-- Upward switch back to Thread 1 for Processing -->
      <path d="M 542 116 L 542 38 L 595 38 L 595 26" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-p)"/>

      <!-- Thread 1 runs Process Task 1 -->
      <rect x="600" y="0" width="98" height="46" rx="6" fill="#0284c7"/>
      <text x="649" y="20" class="box-label" fill="#ffffff">Thread 1 runs</text>
      <text x="649" y="34" class="box-sub" fill="#e0f2fe">Process Task 1</text>

      <!-- Thread 2 runs Process Task 2 -->
      <rect x="710" y="58" width="98" height="46" rx="6" fill="#10b981"/>
      <text x="759" y="78" class="box-label" fill="#ffffff">Thread 2 runs</text>
      <text x="759" y="92" class="box-sub" fill="#ecfdf5">Process Task 2</text>

      <!-- Final outputs -->
      <rect x="710" y="0" width="98" height="46" rx="6" fill="#0369a1"/>
      <text x="759" y="20" class="box-label" fill="#ffffff">Thread 1 runs</text>
      <text x="759" y="34" class="box-sub" fill="#e0f2fe">Output Task 1</text>

      <rect x="710" y="116" width="98" height="46" rx="6" fill="#d97706"/>
      <text x="759" y="136" class="box-label" fill="#ffffff">Thread 3 runs</text>
      <text x="759" y="150" class="box-sub" fill="#fef3c7">Output Task 3</text>
    </g>

    <text x="20" y="238" class="note">Time-Slicing Concurrency: The single CPU core rapidly interleaves between threads. When Thread 1 sleeps/waits, the CPU switches to Thread 2 instead of sitting idle.</text>
  </g>

  <!-- ============================================================== -->
  <!-- C. MULTI-CORE PROCESSOR - CONCURRENT EXECUTION (DIAGRAM c)     -->
  <!-- ============================================================== -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="970" height="275" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="20" y="28" class="section-heading">C. Multi-Core Processor — Threads Execute Concurrently (True Hardware Parallelism)</text>
    <rect x="850" y="12" width="100" height="24" rx="12" fill="#ecfdf5"/>
    <text x="900" y="28" class="tag" fill="#059669" text-anchor="middle">Diagram (c)</text>

    <!-- Core 0: Read Tasks and Distribute -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="180" height="185" rx="10" fill="#4338ca"/>
      <text x="90" y="36" class="core-title">Core 0 (Master)</text>
      <rect x="15" y="55" width="150" height="110" rx="6" fill="#312e81"/>
      <text x="90" y="85" class="box-label" fill="#c7d2fe">Read tasks and</text>
      <text x="90" y="105" class="box-label" fill="#c7d2fe">distribute</text>
      <text x="90" y="135" class="box-sub" fill="#a5b4fc">• Dispatches to Core 1</text>
      <text x="90" y="150" class="box-sub" fill="#a5b4fc">• Dispatches to Core 2</text>
      <text x="90" y="165" class="box-sub" fill="#a5b4fc">• Dispatches to Core 3</text>
    </g>

    <!-- Distribution Arrows from Core 0 to Cores 1, 2, 3 -->
    <path d="M 200 100 L 250 100" class="arrow-purple"/>
    <path d="M 200 145 L 250 162" class="arrow-purple"/>
    <path d="M 200 190 L 250 225" class="arrow-purple"/>

    <!-- Worker Cores in Parallel -->
    <g transform="translate(255, 52)">
      <!-- Core 1 / Thread 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="115" height="52" rx="6" fill="#0284c7"/>
        <text x="57" y="22" class="box-label" fill="#ffffff">Core 1</text>
        <text x="57" y="38" class="box-sub" fill="#e0f2fe">Thread 1</text>

        <line x1="115" y1="26" x2="130" y2="26" class="arrow"/>

        <rect x="132" y="5" width="85" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="174" y="22" class="box-label" fill="#0284c7">Task 1</text>
        <text x="174" y="36" class="box-sub">Read</text>

        <line x1="217" y1="26" x2="232" y2="26" class="arrow"/>

        <rect x="234" y="5" width="85" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="276" y="22" class="box-label" fill="#0284c7">Task 1</text>
        <text x="276" y="36" class="box-sub">Process</text>

        <line x1="319" y1="26" x2="334" y2="26" class="arrow"/>

        <rect x="336" y="5" width="95" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="383" y="22" class="box-label" fill="#0284c7">Task 1</text>
        <text x="383" y="36" class="box-sub">Send output</text>

        <line x1="431" y1="26" x2="480" y2="92" class="arrow-green"/>
      </g>

      <!-- Core 2 / Thread 2 -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="115" height="52" rx="6" fill="#10b981"/>
        <text x="57" y="22" class="box-label" fill="#ffffff">Core 2</text>
        <text x="57" y="38" class="box-sub" fill="#ecfdf5">Thread 2</text>

        <line x1="115" y1="26" x2="130" y2="26" class="arrow"/>

        <rect x="132" y="5" width="85" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
        <text x="174" y="22" class="box-label" fill="#059669">Task 2</text>
        <text x="174" y="36" class="box-sub">Read</text>

        <line x1="217" y1="26" x2="232" y2="26" class="arrow"/>

        <rect x="234" y="5" width="85" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
        <text x="276" y="22" class="box-label" fill="#059669">Task 2</text>
        <text x="276" y="36" class="box-sub">Process</text>

        <line x1="319" y1="26" x2="334" y2="26" class="arrow"/>

        <rect x="336" y="5" width="95" height="42" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
        <text x="383" y="22" class="box-label" fill="#059669">Task 2</text>
        <text x="383" y="36" class="box-sub">Send output</text>

        <line x1="431" y1="26" x2="480" y2="26" class="arrow-green"/>
      </g>

      <!-- Core 3 / Thread 3 -->
      <g transform="translate(0, 132)">
        <rect x="0" y="0" width="115" height="52" rx="6" fill="#f59e0b"/>
        <text x="57" y="22" class="box-label" fill="#ffffff">Core 3</text>
        <text x="57" y="38" class="box-sub" fill="#fef3c7">Thread 3</text>

        <line x1="115" y1="26" x2="130" y2="26" class="arrow"/>

        <rect x="132" y="5" width="85" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="174" y="22" class="box-label" fill="#d97706">Task 3</text>
        <text x="174" y="36" class="box-sub">Read</text>

        <line x1="217" y1="26" x2="232" y2="26" class="arrow"/>

        <rect x="234" y="5" width="85" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="276" y="22" class="box-label" fill="#d97706">Task 3</text>
        <text x="276" y="36" class="box-sub">Process</text>

        <line x1="319" y1="26" x2="334" y2="26" class="arrow"/>

        <rect x="336" y="5" width="95" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="383" y="22" class="box-label" fill="#d97706">Task 3</text>
        <text x="383" y="36" class="box-sub">Send output</text>

        <line x1="431" y1="26" x2="480" y2="-40" class="arrow-green"/>
      </g>
    </g>

    <!-- Collect Outputs & Final Output -->
    <g transform="translate(745, 102)">
      <rect x="0" y="0" width="115" height="85" rx="8" fill="#10b981"/>
      <text x="57" y="38" class="box-label" fill="#ffffff">Collect</text>
      <text x="57" y="55" class="box-label" fill="#ffffff">outputs</text>

      <line x1="115" y1="42" x2="140" y2="42" class="arrow-green"/>

      <rect x="142" y="16" width="65" height="52" rx="6" fill="#047857"/>
      <text x="174" y="46" class="box-label" fill="#ffffff">Output</text>
    </g>

    <text x="20" y="255" class="note">True Hardware Parallelism: Cores 1, 2, and 3 run at the exact same physical clock cycle on separate silicon cores. Computation time is cut to 1/3rd!</text>
  </g>

  <!-- Key Architectural Summary Box at Bottom -->
  <g transform="translate(40, 820)">
    <rect x="0" y="0" width="970" height="85" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="20" y="26" style="font-size: 13px; font-weight: 800; fill: #3730a3;">CORE ARCHITECTURAL TAKEAWAYS:</text>
    <text x="20" y="47" style="font-size: 11.5px; fill: #312e81; font-weight: 500;">1. Sequential (Fig a): 1 Core executes Task 1 completely, then Task 2, then Task 3. Inefficient if tasks wait for I/O.</text>
    <text x="20" y="64" style="font-size: 11.5px; fill: #312e81; font-weight: 500;">2. Single-Core Time Slicing (Fig b): 1 Core shares CPU time across threads via rapid context switches. When a thread sleeps, CPU switches.</text>
    <text x="20" y="81" style="font-size: 11.5px; fill: #312e81; font-weight: 500;">3. Multi-Core Parallelism (Fig c): Multiple physical silicon cores execute distinct threads simultaneously at the exact same instant.</text>
  </g>
</svg>

