<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Tools Explorer: a practical guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--bg:#F6F7FB;--surface:#fff;--ink:#14213D;--muted:#55607a;--line:#d9deea;--accent:#0E7C86;--accent-ink:#fff;--warm:#F2A900;--soft:#e4f3f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--surface:#17203a;--ink:#eef1f8;--muted:#a3adc6;--line:#2b3658;--accent:#3cc4cf;--accent-ink:#0f1626;--warm:#f6bd3a;--soft:#143a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#17203a;--ink:#eef1f8;--muted:#a3adc6;--line:#2b3658;--accent:#3cc4cf;--accent-ink:#0f1626;--warm:#f6bd3a;--soft:#143a4a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.15;margin:0}
header{padding:40px 20px 24px;max-width:1080px;margin:0 auto}
header h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;max-width:15em}
header p{color:var(--muted);max-width:40em;margin:12px 0 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:230px 1fr;gap:28px}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:12px}
nav button{font:inherit;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;line-height:1.3}
nav button small{color:var(--muted);font-size:.8rem}
nav button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button[aria-selected=true] small{color:inherit;opacity:.85}
button:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;min-width:0}
main h2{font-size:2rem}
.maker{color:var(--muted);margin:2px 0 18px}
.tag{display:inline-block;background:var(--soft);color:var(--ink);border-radius:20px;padding:2px 12px;font-size:.85rem;margin:0 6px 6px 0}
section{margin-top:26px}
section h3{font-size:1.2rem;margin-bottom:8px;border-left:4px solid var(--warm);padding-left:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.steps button,.chips button{font:inherit;font-size:.92rem;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.steps button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepbody{background:var(--bg);border-radius:10px;padding:14px 16px;min-height:72px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ex{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex .p,.ex .o{padding:12px 16px}
.ex .p{background:var(--bg);border-bottom:1px solid var(--line)}
.ex b{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.ex .o{white-space:pre-line}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:10px 0 0}
.note{font-size:.92rem;color:var(--muted);margin-top:10px}
.picker{max-width:1080px;margin:0 auto 28px;padding:0 20px}
.picker div{border:1px dashed var(--accent);border-radius:12px;padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
#rec{font-weight:600}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}nav button{min-width:150px}main{padding:20px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<h1>Five AI tools, explained for builders, students and businesses</h1>
<p>Pick a tool to see what it is for, why it matters, how to start, and practical examples from work, education and everyday life. Sample outputs are illustrative, not live model responses.</p>
</header>

<div class="picker"><div>
<label for="task">Not sure where to start? I want to</label>
<select id="task">
<option value="">Choose a goal…</option>
<option value="0">answer questions or draft text in different languages</option>
<option value="1">use free open-source language models</option>
<option value="2">create posters and festival artwork</option>
<option value="3">write code faster</option>
<option value="4">predict something from my own data without coding</option>
</select>
<span id="rec"></span>
</div></div>

<div class="wrap">
<nav id="tabs" role="tablist" aria-label="AI tools"></nav>
<main id="panel" role="tabpanel" aria-live="polite"></main>
</div>

<script>
var T=[
{n:"GPT-4",s:"Chat and writing",by:"OpenAI",tags:["Text","Reasoning","Translation"],
purpose:"GPT-4 is a large language model. You type a request in plain language and it writes, summarises, translates, explains or reasons through it. It works in many languages, though quality is best in English and Hindi and varies in others, so always review its output.",
why:"People use many languages and have different levels of digital experience. A model that explains a complex notice in plain language can reduce communication barriers in public services, banking, education and small-business support.",
steps:[["Open","Use ChatGPT on web or mobile, or the OpenAI API if you are building an app."],["Give context","Say who you are, the task and the language: “I run a kirana store. Reply in simple Hindi.”"],["Be specific","Add format and length: “5 bullet points, under 100 words.”"],["Check facts","Verify figures, legal points and government rules against official sources such as the GST portal."],["Refine","Reply with “shorter”, “more formal” or “add an example” to improve the result."]],
ex:[["Multilingual public-service assistant","A multilingual messaging assistant can let people ask questions by voice or text about public services and receive answers in a language they understand.","Prompt: “Which scheme helps a small farmer with crop insurance?”\nOutput: A short answer in the user’s language naming the relevant scheme and where to apply. Users should confirm details on the official site."],["Exam and concept doubt solving","Students use it as a patient tutor that explains a concept step by step and quizzes them afterwards.","Prompt: “Explain a constitutional right to me like I am in class 10, then ask me 3 questions.”\nOutput: A plain explanation with a landmark-case example, followed by three practice questions."],["Small business replies","A shop owner drafts polite WhatsApp replies and product descriptions.","Prompt: “Write a seasonal offer message for my clothing store, 20% off.”\nOutput: A warm, short festive message with the offer and a call to visit or order."]]},
{n:"Hugging Face",s:"Open model hub",by:"Hugging Face",tags:["Open source","Models","Datasets"],
purpose:"Hugging Face is the GitHub of AI: a hub with hundreds of thousands of free models and datasets, plus libraries such as Transformers to run them. You can use a model as is, fine-tune it, or host it in a Space.",
why:"Many languages have less digital training data than English. Open models from research groups and companies can help teams build local-language tools, adapt models to their needs and, when self-hosted, retain greater control over their data.",
steps:[["Sign up","Create a free account on huggingface.co."],["Find a model","Search for a task such as “translation” and filter by the language you need."],["Read the card","Check the model card for licence, languages and limits."],["Try it","Use the Inference widget on the page, or run it in a notebook (Google Colab is free)."],["Deploy","Share a demo as a Space, or fine-tune on your own data."]],
ex:[["Translate between two languages","Multilingual translation models are available on Hugging Face and can be used to translate between supported languages.","Input: A sentence about a bus timetable in one language\nOutput: The same meaning in another supported language."],["Voice and text for multilingual apps","Researchers combine open speech and translation models to build voice assistants for people who prefer speaking rather than typing.","Pipeline: speech to text, translate, text to speech.\nResult: A user can ask a question by voice and hear the answer in their preferred language."],["Student projects","Colleges use it for sentiment analysis of Hindi or Tamil tweets and news.","Input: a Hindi review\nOutput: positive 0.92"]],
code:"from transformers import pipeline\nclf = pipeline(\"sentiment-analysis\",\n  model=\"nlptown/bert-base-multilingual-uncased-sentiment\")\nprint(clf(\"यह फोन बहुत अच्छा है\"))"},
{n:"Stable Diffusion",s:"Image generation",by:"Stability AI",tags:["Images","Open weights","Design"],
purpose:"Stable Diffusion turns a text description into an image. Because its model weights are openly available, you can run it on your own computer, fine-tune it on a style, and edit parts of an existing picture.",
why:"Small businesses, teachers and creators often cannot afford a designer for every poster. Seasonal celebrations and events create recurring demand for greetings, banners and social posts. Open weights also let artists train a model on regional art styles.",
steps:[["Pick a way to run","Use a web tool such as DreamStudio or run it locally with a GPU (tools like ComfyUI or AUTOMATIC1111)."],["Write the prompt","Describe subject, style, colours and mood: “rangoli, Sankranti morning, overhead view, bright colours”."],["Add a negative prompt","List what to avoid: “blurry, extra fingers, text errors”."],["Generate variations","Change the seed or settings and pick the best image."],["Finish","Add real text (Telugu, Hindi) in Canva or Photoshop, because AI often garbles Indic script."]],
ex:[["Festival creatives","A local bakery or shop creates a seasonal promotional banner without hiring a designer.","Prompt: “a festive tabletop display with flowers and warm lights, space for text on top”\nOutput: Four banner backgrounds to choose from."],["Regional art styles","Designers explore folk-art-inspired patterns from different regions for textile concepts.","Prompt: “traditional hand-painted peacock border, deep blue and warm red, flat pattern”\nOutput: Pattern drafts to refine by hand before production."],["Teaching aids","Teachers create visuals for a lesson on seasonal weather patterns.","Prompt: “Rain clouds over green agricultural fields, educational illustration”\nOutput: A classroom illustration."]],
note:"Responsible use: do not make fake images of real people. Many jurisdictions treat harmful deepfakes seriously, and you should label AI-generated images."},
{n:"GitHub Copilot",s:"AI pair programmer",by:"GitHub / Microsoft",tags:["Coding","IDE","Productivity"],
purpose:"GitHub Copilot sits inside your code editor (VS Code, JetBrains and others). It suggests the next lines as you type, answers questions in a chat panel, explains unfamiliar code and helps write tests and fix bugs.",
why:"Developers around the world—from students to enterprise software teams—work with large codebases and repetitive tasks. Copilot can reduce routine typing, help beginners learn by example, and speed up documentation and testing. Access and eligibility depend on GitHub's current plans and programmes.",
steps:[["Get access","Sign in at github.com and check Copilot plans, or apply for the free student programme with your college email."],["Install","Add the GitHub Copilot extension in VS Code."],["Write a comment","Type what you want: “# read UPI transactions csv and total by merchant”."],["Accept or edit","Press Tab to accept a suggestion, or keep typing to ignore it."],["Use chat","Ask “explain this function” or “write unit tests for this”."]],
ex:[["Student learning Python","A university student builds a grade calculator and learns coding patterns as Copilot suggests them.","Comment: # calculate CGPA from list of grades\nOutput: A working function the student reads, tests and modifies."],["IT services teams","Software teams use AI assistants to understand and modernise older Java and COBOL code.","Chat: “Explain what this batch job does”\nOutput: A step-by-step summary of the legacy code."],["Fintech startup","A team writes a script that totals digital payment transactions by merchant.","Comment: # sum transaction amount by merchant from payments.csv\nOutput: pandas groupby code in seconds."]],
code:"# read upi.csv and total amount by merchant\nimport pandas as pd\ndf = pd.read_csv(\"upi.csv\")\nprint(df.groupby(\"merchant\")[\"amount\"].sum())",
note:"Review every suggestion. Copilot can be wrong, and you should never paste secrets or customer data into code."},
{n:"Google AutoML",s:"No-code model training",by:"Google Cloud (Vertex AI)",tags:["Machine learning","No-code","Prediction"],
purpose:"AutoML trains a custom machine learning model from your own labelled data without you writing model code. It now lives inside Google Cloud’s Vertex AI, and handles tabular data, images, text and video.",
why:"Many businesses and organisations have useful data—sales records, equipment images, customer feedback or transaction histories—but limited machine-learning expertise. AutoML can help an analyst build and evaluate a predictive model with less manual model development.",
steps:[["Create a project","Sign in to Google Cloud and open Vertex AI."],["Upload data","Add a CSV or a folder of labelled images."],["Choose the goal","Pick classification, regression or forecasting."],["Train","Set a budget and let AutoML try models. Check precision, recall and errors."],["Deploy","Publish an endpoint, or run batch predictions. Delete it afterwards to avoid ongoing charges."]],
ex:[["Plant leaf condition classification","An agricultural technology team trains an image model on photos labelled with healthy and affected plant conditions.","Input: A photo of a plant leaf\nOutput: A predicted leaf condition with a confidence score and a recommendation to consult an agricultural expert."],["Small-store demand forecast","A retailer forecasts weekly sales for a busy seasonal period using past sales.","Input: 2 years of weekly sales\nOutput: Forecast per product, with higher stock advice before Diwali."],["Loan repayment risk","A lender estimates repayment risk to support—not replace—human review.","Input: Relevant, lawfully collected financial and repayment information\nOutput: A risk estimate for review, not an automatic lending decision."]],
note:"Quality depends on your data. Biased or too-small data gives unreliable models, and cloud use costs money. Set a budget limit."}
];
var cur=0,stp=0,exi=0;
var tabs=document.getElementById("tabs"),panel=document.getElementById("panel");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
 var t=T[cur];
 tabs.innerHTML=T.map(function(x,i){return '<button role="tab" aria-selected="'+(i==cur)+'" data-t="'+i+'">'+x.n+'<small>'+x.s+'</small></button>'}).join("");
 var h='<h2>'+t.n+'</h2><p class="maker">by '+t.by+'</p><div>'+t.tags.map(function(g){return '<span class="tag">'+g+'</span>'}).join("")+'</div>';
 h+='<section><h3>What it is for</h3><p>'+t.purpose+'</p></section>';
 h+='<section><h3>Why it matters</h3><p>'+t.why+'</p></section>';
 h+='<section><h3>How to use it</h3><div class="steps">'+t.steps.map(function(s,i){return '<button aria-pressed="'+(i==stp)+'" data-s="'+i+'">'+(i+1)+'. '+s[0]+'</button>'}).join("")+'</div><div class="stepbody">'+t.steps[stp][1]+'</div>';
 if(t.code)h+='<pre><code>'+esc(t.code)+'</code></pre>';
 h+='</section>';
 var e=t.ex[exi],p=e[2].split("\n");
 h+='<section><h3>Practical examples</h3><div class="chips">'+t.ex.map(function(x,i){return '<button aria-pressed="'+(i==exi)+'" data-e="'+i+'">'+x[0]+'</button>'}).join("")+'</div>';
 h+='<div class="ex"><div class="p"><b>Scenario</b>'+e[1]+'</div><div class="o"><b>Sample (illustrative)</b>'+esc(e[2])+'</div></div>';
 if(t.note)h+='<p class="note">'+t.note+'</p>';
 h+='</section>';
 panel.innerHTML=h;
}
document.addEventListener("click",function(ev){
 var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.t!==undefined){cur=+b.dataset.t;stp=0;exi=0;render();document.getElementById("panel").scrollIntoView({block:"start"})}
 else if(b.dataset.s!==undefined){stp=+b.dataset.s;render()}
 else if(b.dataset.e!==undefined){exi=+b.dataset.e;render()}
});
document.getElementById("task").addEventListener("change",function(e){
 var v=e.target.value,r=document.getElementById("rec");
 if(v===""){r.textContent="";return}
 r.textContent="Try "+T[+v].n+".";cur=+v;stp=0;exi=0;render();
});
render();
</script>
</body>
</html>
